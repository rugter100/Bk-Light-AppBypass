{% extends 'base.html' %}

{% block title %}{{ lang.site.title }} | {{ lang.page_title.home }}{% endblock %}


{% block content %}
<div class="container-fluid py-4">
    <h2 class="text-center mb-4">{{ lang.home.title }}</h2>
    <div class="d-flex flex-wrap justify-content-center gap-4" id="shift-container">
        <!-- Cards -->
        <div class="card bg-dark" style="width:320px;">
            <div class="card-header text-center">{{ lang.home.panel }}</div>

            <div class="card-body p-3">

                <figure class="figure mx-auto d-block">
                    <img src="{{ url_for('web.static', filename='media/test_pattern_32x32.png') }}" class="figure-img rounded w-100" alt="Current Image">
                    <figcaption class="figure-caption">Current Image</figcaption>
                </figure>
                <button class="btn btn-primary btn-sm d-block mx-auto" data-bs-toggle="modal" data-bs-target="#uploadImage">
                    upload image
                </button>
            </div>
        </div>
    </div>
    </div>
    <div class="d-flex justify-content-center">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="uploadImage" tabindex="-1" aria-labelledby="uploadImageLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="uploadImageLabel">updateprofilepic</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                    <div class="modal-body text-center">
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            error
                        </div>
                        <button class="btn p-0 border-0 bg-transparent mx-auto d-block">
                            <img src="{{ url_for('web.static', filename='media/test_pattern_32x32.png') }}" class="figure-img rounded w-100" alt="Current Image">
                        </button>
                    </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">update</button>
                    <button type="button" class="btn btn-primary">save changes</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>

</script>
{% endblock %}
