<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello!</title>
    <link rel= "stylesheet" type= "text/css" href= "{{url_for('web.static', filename='styles/bootstrap.min.css') }}">
    <style>
        /* Ensures the body and html elements take the full height of the viewport */
        html, body {
            height: 100%;
            margin: 0;
        }

        /* Main container that uses Flexbox to ensure the footer stays at the bottom */
        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Content container that grows to fill the remaining space */
        .content {
            flex: 1;
        }

        /* Style for the footer */
        footer {
            background-color: #f8f9fa;
            text-align: center;
            padding: 1em 0;
        }
    </style>
</head>
<body class="bg-body text-body">
    <div class="wrapper">
        <header class="navbar navbar-expand-lg navbar-dark bg-primary">
            <a class="navbar-brand" href="https://vamting.com">{{ lang.site.title }}</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav mr-auto">
                </ul>
            </div>
        </header>
        <div class="content">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <h2 class="text-center mt-5">{{ lang.login.title }}</h2>
                        <form action="" method="post" class="mt-3">
                            <div class="form-group mb-3">
                                <label for="friendcode">{{ lang.login.code }}</label>
                                <input type="text" class="form-control" id="friendcode" name="friendcode" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">{{ lang.login.connect }}</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <footer class="bg-body-tertiary">
            &copy; 2025 Vamting IT ● <a href="{{ url_for('web.privacy_policy') }}">Privacy and user data information</a>
        </footer>
    </div>
    <!-- Bootstrap JS and dependencies -->
    <script src="{{ url_for('web.static', filename='js/popper.min.js') }}"></script>
    <script src="{{ url_for('web.static', filename='js/bootstrap.min.js') }}"></script>
</body>
</html>
